<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Era Movement</title>
<meta name="description" content="Preparing for The New Era.">
<meta name="theme-color" content="#000516">
<meta property="og:title" content="New Era Movement">
<meta property="og:description" content="Preparing for The New Era.">
<meta property="og:image" content="https://neweramovement.org/emblem.webp">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="preload" href="fonts/montserrat-latin-300-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family:"Montserrat"; font-style:normal; font-weight:300; font-display:swap; src:url("fonts/montserrat-latin-300-normal.woff2") format("woff2"); }
  @font-face { font-family:"Montserrat"; font-style:normal; font-weight:400; font-display:swap; src:url("fonts/montserrat-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family:"Montserrat"; font-style:normal; font-weight:500; font-display:swap; src:url("fonts/montserrat-latin-500-normal.woff2") format("woff2"); }
  @font-face { font-family:"Montserrat"; font-style:normal; font-weight:600; font-display:swap; src:url("fonts/montserrat-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family:"Cormorant Garamond"; font-style:italic; font-weight:300; font-display:swap; src:url("fonts/cormorant-garamond-latin-300-italic.woff2") format("woff2"); }
  :root { --bg:#000516; --ink:#eef2f8; --muted:#8a8f9c; --gold:#e8c98a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    background:var(--bg); color:var(--ink);
    font-family:"Montserrat",system-ui,sans-serif;
    display:flex; justify-content:center;
    overflow-x:hidden; min-height:100svh;
  }

  /* light rays falling onto the emblem from above */
  .rays {
    position:fixed; left:50%; top:-25vh; width:150vmax; height:115vh; z-index:0;
    transform:translateX(-50%); pointer-events:none;
    background:conic-gradient(from 180deg at 50% 0%,
      transparent 160deg,
      rgba(90,220,210,.05) 167deg, rgba(150,240,230,.20) 172deg,
      rgba(90,220,210,.04) 176deg, rgba(232,201,138,.16) 180deg,
      rgba(90,220,210,.05) 185deg, rgba(150,240,230,.17) 190deg,
      transparent 200deg);
    -webkit-mask-image:linear-gradient(to bottom,#000 15%,transparent 72%);
            mask-image:linear-gradient(to bottom,#000 15%,transparent 72%);
    filter:blur(7px);
    animation:rays 9s ease-in-out infinite alternate;
  }
  @keyframes rays {
    0%   { opacity:.6; transform:translateX(-50%) rotate(-1.5deg); }
    100% { opacity:1;  transform:translateX(-50%) rotate(1.5deg); }
  }
  /* faint dust drifting through the light */
  .dust {
    position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.5;
    background-image:
      radial-gradient(1px 1px at 20% 30%, #9ff 50%, transparent 51%),
      radial-gradient(1px 1px at 65% 22%, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 42% 70%, #bfe 50%, transparent 51%),
      radial-gradient(1px 1px at 80% 60%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 33% 85%, #9ee 50%, transparent 51%),
      radial-gradient(1px 1px at 55% 45%, #fff 50%, transparent 51%);
    background-size:600px 600px;
    animation:dust 60s linear infinite;
  }
  @keyframes dust { to { background-position:0 -600px; } }

  main { position:relative; z-index:1; text-align:center; padding:2rem 1.5rem; margin:auto 0; }

  /* 3D stage for the emblem */
  .stage { perspective:1100px; width:min(34vw,170px); margin:0 auto; }
  @media (max-height:760px) { .stage { width:min(30vw,130px); } }
  @media (max-height:600px) {
    main { padding:1.2rem 1.5rem; }
    .stage { width:min(26vw,96px); }
    .word { margin-top:1rem; } .ne { font-size:clamp(1.6rem,4.6vw,2.4rem); }
    .initiatives { margin-top:1.3rem; } blockquote { margin-top:1.3rem; }
    blockquote p { font-size:clamp(1.2rem,3vw,1.7rem); }
  }
  .tilt  { transform-style:preserve-3d; transition:transform .7s cubic-bezier(.2,.7,.2,1); }
  .mark {
    position:relative; transform-style:preserve-3d; opacity:0;
    animation:
      enter 2.4s cubic-bezier(.2,.7,.2,1) .2s forwards,
      sway 14s ease-in-out 2.6s infinite;
  }
  @keyframes enter {
    from { opacity:0; transform:translateY(20px) rotateX(20deg) scale(.93); filter:blur(8px); }
    to   { opacity:1; transform:none; filter:blur(0); }
  }
  @keyframes sway {
    0%,100% { transform:rotateY(-17deg) rotateX(5deg)  translateY(0); }
    50%     { transform:rotateY(17deg)  rotateX(-3deg) translateY(-9px); }
  }
  .emblem {
    width:100%; height:auto; display:block;
    animation:glow 7s ease-in-out 2.6s infinite;
  }
  @keyframes glow {
    0%,100% { filter:drop-shadow(0 22px 30px rgba(0,0,0,.7)) drop-shadow(0 0 14px rgba(232,201,138,.18)); }
    50%     { filter:drop-shadow(0 22px 30px rgba(0,0,0,.7)) drop-shadow(0 0 26px rgba(110,230,220,.22)) drop-shadow(0 0 50px rgba(232,201,138,.12)); }
  }
  /* glass-like highlight sweeping across the emblem, clipped to its oval */
  .shine, .edge {
    position:absolute; inset:0; pointer-events:none;
    clip-path:ellipse(45.8% 47.1% at 50% 50.1%);
  }
  .shine {
    background:linear-gradient(112deg,
      transparent 40%, rgba(255,255,255,.12) 45%,
      rgba(255,250,235,.75) 50%, rgba(255,255,255,.12) 55%, transparent 60%);
    background-size:300% 100%;
    mix-blend-mode:screen;
    animation:sweep 7s cubic-bezier(.45,0,.2,1) 2.4s infinite;
  }
  @keyframes sweep { 0% { background-position:120% 0; } 45%,100% { background-position:-20% 0; } }
  .edge {
    background:linear-gradient(200deg,rgba(255,255,255,.28),transparent 45%);
    mix-blend-mode:screen;
    animation:edge 14s ease-in-out 2.6s infinite;
  }
  @keyframes edge { 0%,100% { opacity:.15; } 50% { opacity:.55; } }

  /* wordmark: live type, gold with a slow glint */
  .word { margin:1.7rem auto 0; opacity:0; animation:rise 1.8s ease 1.4s forwards;
          font-family:"Montserrat",system-ui,sans-serif; user-select:none; }
  .ne {
    font-weight:300; font-size:clamp(2.1rem,6.2vw,3.3rem); line-height:1; letter-spacing:.16em;
    padding-left:.16em; white-space:nowrap;
  }
  .ne .g {
    background-image:
      linear-gradient(105deg, transparent 42%, rgba(255,250,235,.95) 50%, transparent 58%),
      linear-gradient(180deg, #f7e2b4 0%, #e3b974 48%, #c99550 100%);
    background-size:300% 100%, 100% 100%; background-repeat:no-repeat;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:glint 9s cubic-bezier(.45,0,.2,1) 4s infinite;
  }
  .ne .lam { display:inline-block; transform:rotate(180deg); letter-spacing:0; margin-right:-.16em; animation:none;
    background-image:linear-gradient(0deg, #f7e2b4 0%, #e3b974 48%, #c99550 100%); background-size:100% 100%; }
  @keyframes glint { 0% { background-position:120% 0, 0 0; } 45%,100% { background-position:-20% 0, 0 0; } }
  .mv { display:flex; align-items:center; justify-content:center; gap:1.1em; margin-top:.55em;
        font-weight:400; font-size:clamp(.66rem,1.75vw,.95rem); letter-spacing:.62em; color:#d2f1ee; }
  .mv span { padding-left:.62em; }
  .mv i { display:block; width:2.6em; height:1px; background:linear-gradient(90deg,transparent,#d9b273); }
  .mv i:last-child { transform:scaleX(-1); }

  /* the initiatives under the umbrella */
  .initiatives {
    display:flex; justify-content:center; align-items:center; gap:clamp(1.5rem,6vw,5rem);
    margin-top:2.4rem; opacity:0; animation:rise 1.6s ease 2.0s forwards;
  }
  .initiative { display:block; text-decoration:none; color:inherit; transition:transform .4s ease, filter .4s ease; }
  .initiative:hover { transform:translateY(-3px); filter:brightness(1.15); }
  .cp, .pasai { display:flex; align-items:center; gap:.7rem; text-align:left; }
  .cp svg { width:clamp(56px,7.6vw,76px); height:auto; flex:none; overflow:visible; }
  .cp .name { display:block; font-family:"Montserrat",system-ui,sans-serif; font-weight:300;
    font-size:clamp(1.15rem,2.6vw,1.55rem); letter-spacing:.01em; line-height:1.1; color:#f4f8fc; white-space:nowrap; }
  .cp .name b { font-weight:600; }
  .cp .tag { display:block; margin-top:.3rem; font-family:"Montserrat",system-ui,sans-serif;
    font-size:clamp(.42rem,1vw,.55rem); letter-spacing:.2em; color:#cfd6e2; white-space:nowrap; }
  .pasai svg { width:clamp(52px,7vw,70px); height:auto; flex:none; overflow:visible; }
  .pasai .name {
    display:block; font-family:"Montserrat",system-ui,sans-serif; font-weight:500;
    font-size:clamp(1.15rem,2.6vw,1.55rem); letter-spacing:.04em; line-height:1.1;
    background:linear-gradient(90deg,#f1dfb4,#e8c98a 40%,#8fe6da);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .pasai .tag { display:block; margin-top:.3rem; font-family:"Montserrat",system-ui,sans-serif;
    font-size:clamp(.42rem,1vw,.55rem); letter-spacing:.2em; color:#cfd6e2; white-space:nowrap; }
  .pm-ring  { animation:pmring 6s ease-in-out infinite; transform-origin:50px 50px; }
  @keyframes pmring { 0%,100% { opacity:.85; } 50% { opacity:1; } }
  .pm-node  { animation:pmnode 3.2s ease-in-out infinite; }
  .pm-node:nth-of-type(2) { animation-delay:.5s; } .pm-node:nth-of-type(3) { animation-delay:1s; }
  .pm-node:nth-of-type(4) { animation-delay:1.5s; }
  @keyframes pmnode { 0%,100% { opacity:.45; } 40% { opacity:1; } }
  .pm-star { transform-origin:50px 17px; animation:pmstar 3.2s ease-in-out 2s infinite; }
  @keyframes pmstar { 0%,100% { transform:scale(.8); opacity:.75; } 15% { transform:scale(1.25); opacity:1; } }
  @media (max-width:560px) {
    .initiatives { flex-direction:column; gap:1.4rem; }
    .pasai { width:auto; }
  }

  blockquote { margin-top:2.4rem; opacity:0; animation:rise 1.6s ease 2.4s forwards; }
  blockquote p {
    font-family:"Cormorant Garamond",Georgia,serif; font-style:italic; font-weight:300;
    font-size:clamp(1.4rem,4vw,2.2rem); line-height:1.25;
  }
  blockquote footer {
    margin-top:.9rem; font-size:.72rem; letter-spacing:.32em; text-transform:uppercase; color:var(--muted);
  }
  @keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }

  @media (prefers-reduced-motion:reduce) {
    .rays,.dust,.mark,.emblem,.shine,.edge,.word,.ne,.initiatives,.pm-ring,.pm-node,.pm-star,blockquote { animation:none !important; opacity:1; transform:none; }
  }
</style>
</head>
<body>
  <div class="rays" aria-hidden="true"></div>
  <div class="dust" aria-hidden="true"></div>
  <main>
    <h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">New Era Movement</h1>
    <div class="stage">
      <div class="tilt" id="tilt">
        <div class="mark">
          <svg class="emblem" id="emblem" viewBox="0 0 600 904" role="img" aria-label="New Era Movement emblem">
            <defs>
              <clipPath id="nOval"><ellipse cx="300" cy="453" rx="273" ry="424"/></clipPath>
              <radialGradient id="nSky" cx="300" cy="330" r="430" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#0f8790"/><stop offset=".45" stop-color="#0a5f70"/><stop offset="1" stop-color="#012a42"/>
              </radialGradient>
              <radialGradient id="nTop" cx="300" cy="20" r="260" gradientTransform="translate(300 20) scale(.55 1) translate(-300 -20)" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#25dcd4" stop-opacity=".95"/><stop offset=".5" stop-color="#16a9a8" stop-opacity=".45"/><stop offset="1" stop-color="#16a9a8" stop-opacity="0"/>
              </radialGradient>
              <radialGradient id="nVig" cx="300" cy="360" r="300" gradientTransform="translate(300 360) scale(1 1.25) translate(-300 -360)" gradientUnits="userSpaceOnUse">
                <stop offset=".42" stop-color="#012238" stop-opacity="0"/><stop offset="1" stop-color="#011d33" stop-opacity="1"/>
              </radialGradient>
              <radialGradient id="nDawn" cx="300" cy="540" r="320" gradientTransform="translate(300 540) scale(1 .55) translate(-300 -540)" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#fff4d2" stop-opacity=".95"/><stop offset=".1" stop-color="#f1d995" stop-opacity=".6"/>
                <stop offset=".4" stop-color="#2fb7a8" stop-opacity=".5"/><stop offset="1" stop-color="#1fa69c" stop-opacity="0"/>
              </radialGradient>
              <linearGradient id="nRay" x1="0" y1="1" x2="0" y2="0">
                <stop offset="0" stop-color="#fff1c8" stop-opacity=".55"/><stop offset=".6" stop-color="#bff2e4" stop-opacity=".08"/><stop offset="1" stop-color="#bff2e4" stop-opacity="0"/>
              </linearGradient>
              <linearGradient id="nBeam" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#7ff7ee" stop-opacity="0"/><stop offset=".5" stop-color="#c4fff7" stop-opacity=".42"/><stop offset="1" stop-color="#7ff7ee" stop-opacity="0"/>
              </linearGradient>
              <linearGradient id="nBeamFade" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".7" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity=".1"/>
              </linearGradient>
              <mask id="nBeamMask"><rect x="0" y="0" width="600" height="560" fill="url(#nBeamFade)"/></mask>
              <linearGradient id="nPulse" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#f2fffb" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
              </linearGradient>
              <linearGradient id="nGate" x1="0" y1="1" x2="0" y2="0">
                <stop offset="0" stop-color="#fff6d8" stop-opacity=".95"/><stop offset=".35" stop-color="#c9f5e6" stop-opacity=".35"/><stop offset="1" stop-color="#9ff0e3" stop-opacity=".12"/>
              </linearGradient>
              <linearGradient id="nSea" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#1b367c"/><stop offset=".07" stop-color="#112862"/><stop offset=".35" stop-color="#0a1b4c"/><stop offset=".7" stop-color="#040e33"/><stop offset="1" stop-color="#010622"/>
              </linearGradient>
              <radialGradient id="nGlint" cx="300" cy="545" r="150" gradientTransform="translate(0 545) scale(1 .35) translate(0 -545)" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#ffe9b5" stop-opacity=".75"/><stop offset="1" stop-color="#ffe9b5" stop-opacity="0"/>
              </radialGradient>
              <linearGradient id="nWave" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#3554a8"/><stop offset=".5" stop-color="#6f8ee6"/><stop offset="1" stop-color="#3554a8"/>
              </linearGradient>
              <linearGradient id="nRing" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#f8dfa6"/><stop offset=".35" stop-color="#d99a4e"/><stop offset=".6" stop-color="#f6cf86"/><stop offset="1" stop-color="#b9813f"/>
              </linearGradient>
              <filter id="nGlow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
              <filter id="nSoft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
              <linearGradient id="nHz" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#f3b45c"/><stop offset=".3" stop-color="#ffdc94"/><stop offset=".5" stop-color="#ffffff"/><stop offset=".7" stop-color="#ffdc94"/><stop offset="1" stop-color="#f3b45c"/>
              </linearGradient>
              <filter id="nPulseBlur" x="-200%" y="-100%" width="500%" height="300%"><feGaussianBlur stdDeviation="9"/></filter>
              <filter id="nBig" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
            </defs>

            <g clip-path="url(#nOval)">
              <!-- sky -->
              <rect width="600" height="560" fill="url(#nSky)"/>
              <rect width="600" height="560" fill="url(#nTop)"/>
              <rect width="600" height="560" fill="url(#nVig)"/>
              <rect width="600" height="560" fill="url(#nDawn)"><animate attributeName="opacity" values=".8;1;.8" dur="7s" repeatCount="indefinite"/></rect>

              <!-- rays fanning from the dawn -->
              <g class="n-rays" opacity=".55">
              <line x1="300" y1="534" x2="-22.8" y2="465.4" stroke="url(#nRay)" stroke-width="0.7"/>
              <line x1="300" y1="534" x2="-13.8" y2="432.0" stroke="url(#nRay)" stroke-width="1.1"/>
              <line x1="300" y1="534" x2="-1.5" y2="399.8" stroke="url(#nRay)" stroke-width="0.7"/>
              <line x1="300" y1="534" x2="14.2" y2="369.0" stroke="url(#nRay)" stroke-width="1.1"/>
              <line x1="300" y1="534" x2="33.0" y2="340.0" stroke="url(#nRay)" stroke-width="0.7"/>
              <line x1="300" y1="534" x2="54.8" y2="313.2" stroke="url(#nRay)" stroke-width="1.1"/>
              <line x1="300" y1="534" x2="79.2" y2="288.8" stroke="url(#nRay)" stroke-width="0.7"/>
              <line x1="300" y1="534" x2="106.0" y2="267.0" stroke="url(#nRay)" stroke-width="1.1"/>
              <line x1="300" y1="534" x2="135.0" y2="248.2" stroke="url(#nRay)" stroke-width="0.7"/>
              <line x1="300" y1="534" x2="165.8" y2="232.5" stroke="url(#nRay)" stroke-width="1.1"/>
              <line x1="300" y1="534" x2="198.0" y2="220.2" stroke="url(#nRay)" stroke-width="0.7"/>
              <line x1="300" y1="534" x2="231.4" y2="211.2" stroke="url(#nRay)" stroke-width="1.1"/>
              <line x1="300" y1="534" x2="265.5" y2="205.8" stroke="url(#nRay)" stroke-width="0.7"/>
              <line x1="300" y1="534" x2="334.5" y2="205.8" stroke="url(#nRay)" stroke-width="0.7"/>
              <line x1="300" y1="534" x2="368.6" y2="211.2" stroke="url(#nRay)" stroke-width="1.1"/>
              <line x1="300" y1="534" x2="402.0" y2="220.2" stroke="url(#nRay)" stroke-width="0.7"/>
              <line x1="300" y1="534" x2="434.2" y2="232.5" stroke="url(#nRay)" stroke-width="1.1"/>
              <line x1="300" y1="534" x2="465.0" y2="248.2" stroke="url(#nRay)" stroke-width="0.7"/>
              <line x1="300" y1="534" x2="494.0" y2="267.0" stroke="url(#nRay)" stroke-width="1.1"/>
              <line x1="300" y1="534" x2="520.8" y2="288.8" stroke="url(#nRay)" stroke-width="0.7"/>
              <line x1="300" y1="534" x2="545.2" y2="313.2" stroke="url(#nRay)" stroke-width="1.1"/>
              <line x1="300" y1="534" x2="567.0" y2="340.0" stroke="url(#nRay)" stroke-width="0.7"/>
              <line x1="300" y1="534" x2="585.8" y2="369.0" stroke="url(#nRay)" stroke-width="1.1"/>
              <line x1="300" y1="534" x2="601.5" y2="399.8" stroke="url(#nRay)" stroke-width="0.7"/>
              <line x1="300" y1="534" x2="613.8" y2="432.0" stroke="url(#nRay)" stroke-width="1.1"/>
              <line x1="300" y1="534" x2="622.8" y2="465.4" stroke="url(#nRay)" stroke-width="0.7"/>
                <animate attributeName="opacity" values=".35;.7;.35" dur="9s" repeatCount="indefinite"/>
              </g>

              <!-- the beam, with light travelling up it -->
              <g mask="url(#nBeamMask)">
                <rect x="262" y="0" width="76" height="534" fill="url(#nBeam)"><animate attributeName="opacity" values=".7;1;.7" dur="5s" repeatCount="indefinite"/></rect>
                <ellipse cx="300" cy="520" rx="16" ry="60" fill="#eafffb" filter="url(#nPulseBlur)" opacity=".55">
                  <animate attributeName="cy" values="560;-80" dur="4.2s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .6 1"/>
                </ellipse>
                <ellipse cx="300" cy="520" rx="12" ry="44" fill="#eafffb" filter="url(#nPulseBlur)" opacity=".35">
                  <animate attributeName="cy" values="560;-80" dur="4.2s" begin="2.1s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .6 1"/>
                </ellipse>
              </g>

              <!-- rising light motes (generated) -->
              <g id="nMotes" filter="url(#nGlow)"></g>

              <!-- sea -->
              <path d="M0 576 Q300 492 600 576 L600 904 L0 904 Z" fill="url(#nSea)"/>

          <path d="M-6 100 H40 L46 92 L52 100 H58 L66 34 L75 158 L83 100 L89 108 L95 100 C108 112 118 70 138 74 C156 78 160 118 182 112" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#cGlow)" pathLength="100" stroke-dasharray="12 112">
            <animate attributeName="stroke-dashoffset" values="12;-100" dur="2.6s" repeatCount="indefinite" calcMode="spline" keySplines=".35 0 .65 1"/>
            <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.85;1" dur="2.6s" repeatCount="indefinite"/>
          </path>
        </svg>
        <span><span class="name">Conscious <b>Pulse</b></span><span class="tag">A New Era Movement initiative</span></span>
      </div>
      <a class="initiative pasai" href="https://pasai.art" aria-label="Pasai, a New Era Movement initiative">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <defs>
            <linearGradient id="pmg" x1="0" y1="1" x2="1" y2="0">
              <stop offset="0" stop-color="#e8c98a"/><stop offset=".55" stop-color="#f3e3bd"/><stop offset="1" stop-color="#5fe0d2"/>
            </linearGradient>
            <radialGradient id="pmsky" cx="50%" cy="20%" r="70%">
              <stop offset="0" stop-color="#1fb7b0" stop-opacity=".35"/><stop offset="1" stop-color="#000516" stop-opacity="0"/>
            </radialGradient>
            <filter id="pmglow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <clipPath id="pmclip"><circle cx="50" cy="50" r="43"/></clipPath>
          </defs>
          <circle cx="50" cy="50" r="43" fill="url(#pmsky)"/>
          <g clip-path="url(#pmclip)">
            <path d="M4 74 Q50 60 96 74 L96 100 L4 100 Z" fill="#06143a" opacity=".9"/>
            <path d="M4 74 Q50 60 96 74" stroke="#e8c98a" stroke-width="1.2" fill="none" filter="url(#pmglow)"/>
          </g>
          <path id="pmpath" d="M50 67 L40 52 L57 41 L45 29 L50 17" stroke="#7fe3d6" stroke-width=".9" fill="none" opacity=".65"/>
          <g fill="#bff3ea" filter="url(#pmglow)">
            <circle class="pm-node" cx="50" cy="67" r="2.6" fill="#f3e3bd"/>
            <circle class="pm-node" cx="40" cy="52" r="1.6"/>
            <circle class="pm-node" cx="57" cy="41" r="1.6"/>
            <circle class="pm-node" cx="45" cy="29" r="1.6"/>
          </g>
          <path class="pm-star" d="M50 10 L51.6 15.4 L57 17 L51.6 18.6 L50 24 L48.4 18.6 L43 17 L48.4 15.4 Z" fill="#fff6dc" filter="url(#pmglow)"/>
          <circle r="1.8" fill="#ffffff" filter="url(#pmglow)">
            <animateMotion dur="3.2s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.6;1" calcMode="linear"><mpath href="#pmpath"/></animateMotion>
            <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.08;.55;.62;1" dur="3.2s" repeatCount="indefinite"/>

  </main>
<script>
  // light motes rising out of the gateway into the beam (vector, crisp at any size)
  (function () {
    var g = document.getElementById('nMotes'); if (!g) return;
    var NS = 'http://www.w3.org/2000/svg', still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    var M = [], N = 110;
    function r(a, b) { return a + Math.random() * (b - a); }
    function spawn(m, init) {
      m.y = init ? r(40, 520) : r(470, 525);
      m.x0 = 300 + r(-1, 1) * r(4, 30);
      m.v = r(.15, .5); m.s = r(.8, 2.6); m.ph = r(0, 6.3); m.tw = r(1, 3);
      m.gold = Math.random() < .7;
      m.el.setAttribute('r', m.s.toFixed(2));
      m.el.setAttribute('fill', m.gold ? '#ffd987' : '#d6fff6');
    }
    for (var i = 0; i < N; i++) {
      var c = document.createElementNS(NS, 'circle'); g.appendChild(c);
      var m = { el: c }; spawn(m, true); M.push(m);
    }
    // fixed stars scattered through the sky, twinkling
    var S = [];
    for (var k = 0; k < 46; k++) {
      var sy = r(60, 470), sx = 300 + r(-1, 1) * (60 + (534 - sy) * .35) * r(.3, 1.6);
      var st = document.createElementNS(NS, 'circle');
      st.setAttribute('cx', sx.toFixed(1)); st.setAttribute('cy', sy.toFixed(1));
      st.setAttribute('r', r(.8, 2).toFixed(2)); st.setAttribute('fill', Math.random() < .8 ? '#ffe3a0' : '#e6fffa');
      g.appendChild(st); S.push({ el: st, ph: r(0, 6.3), sp: r(.5, 1.8) });
    }
    var t0 = performance.now();
    function tick(now) {
      var t = (now - t0) / 1000;
      for (var i = 0; i < N; i++) {
        var m = M[i];
        if (!still) { m.y -= m.v; if (m.y < 20) spawn(m, false); }
        var h = 534 - m.y, spread = 1 + h / 120;              // cone widens as it rises
        var x = 300 + (m.x0 - 300) * spread + Math.sin(t * .6 + m.ph) * 3;
        var fadeIn = Math.min(1, h / 40), fadeOut = Math.min(1, m.y / 120);
        var tw = .55 + .45 * Math.sin(t * m.tw + m.ph);
        m.el.setAttribute('cx', x.toFixed(1)); m.el.setAttribute('cy', m.y.toFixed(1));
        m.el.setAttribute('opacity', Math.min(1, fadeIn * fadeOut * tw * 1.25).toFixed(2));
      }
      for (var q = 0; q < S.length; q++) S[q].el.setAttribute('opacity', (.35 + .65 * Math.pow((Math.sin(t * S[q].sp + S[q].ph) + 1) / 2, 2)).toFixed(2));
      if (!still) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  })();

  // Conscious Pulse: dotted wave ribbon breathing
  (function () {
    var g = document.getElementById('cDots'); if (!g) return;
    var NS = 'http://www.w3.org/2000/svg', still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    var D = [];
    for (var k = 0; k < 9; k++) for (var x = 104; x <= 196; x += 4.6) {
      var c = document.createElementNS(NS, 'circle');
      c.setAttribute('r', (1.15 - k * .06).toFixed(2));
      c.setAttribute('fill', k < 3 ? '#9ff3ff' : '#5fd0f0');
      g.appendChild(c); D.push({ el: c, k: k, x: x });
    }
    var t0 = performance.now();
    function tick(now) {
      var t = (now - t0) / 1000;
      for (var i = 0; i < D.length; i++) {
        var d = D[i], u = (d.x - 100) / 96, spread = (d.k - 4) * (2 + u * 9);
        var y = 100 - 26 * Math.sin(u * 5.2 - .9 + Math.sin(t * .8) * .35) * (0.4 + u * .6) + spread;
        var inside = Math.hypot(d.x - 100, y - 100) < 92 ? 1 : .55;
        d.el.setAttribute('cx', d.x.toFixed(1)); d.el.setAttribute('cy', y.toFixed(1));
        d.el.setAttribute('opacity', ((.95 - d.k * .085) * (.35 + u * .75) * inside).toFixed(2));
      }
      if (!still) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  })();

  // gentle tilt toward the pointer (desktop only)
  (function () {
    var t = document.getElementById('tilt');
    if (!t || matchMedia('(prefers-reduced-motion: reduce)').matches || !matchMedia('(pointer:fine)').matches) return;
    addEventListener('pointermove', function (e) {
      var x = e.clientX / innerWidth - .5, y = e.clientY / innerHeight - .5;
      t.style.transform = 'rotateY(' + (x * 14) + 'deg) rotateX(' + (-y * 10) + 'deg)';
    });
    document.addEventListener('pointerleave', function () { t.style.transform = ''; });
  })();
</script>
