<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The New Era Movement</title>
<meta name="description" content="Preparing for The New Era.">
<meta name="theme-color" content="#000516">
<meta property="og:title" content="The New Era Movement">
<meta property="og:description" content="Preparing for The New Era.">
<meta property="og:image" content="https://neweramovement.org/emblem.webp">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="preload" href="emblem.webp" as="image">
<link rel="preload" href="fonts/montserrat-latin-300-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family:"Montserrat"; font-style:normal; font-weight:300; font-display:swap; src:url("fonts/montserrat-latin-300-normal.woff2") format("woff2"); }
  @font-face { font-family:"Montserrat"; font-style:normal; font-weight:400; font-display:swap; src:url("fonts/montserrat-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family:"Montserrat"; font-style:normal; font-weight:500; font-display:swap; src:url("fonts/montserrat-latin-500-normal.woff2") format("woff2"); }
  @font-face { font-family:"Montserrat"; font-style:normal; font-weight:600; font-display:swap; src:url("fonts/montserrat-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family:"Cormorant Garamond"; font-style:italic; font-weight:300; font-display:swap; src:url("fonts/cormorant-garamond-latin-300-italic.woff2") format("woff2"); }
  :root { --bg:#000516; --ink:#f4f8fc; --muted:#8a8f9c; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { min-height:100%; }
  body {
    background:var(--bg); color:var(--ink);
    font-family:"Montserrat",system-ui,sans-serif;
    display:flex; justify-content:center; overflow-x:hidden; min-height:100svh;
  }

  /* ---------- space ---------- */
  #space { position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }
  .rays {
    position:fixed; left:50%; top:-25vh; width:150vmax; height:115vh; z-index:0;
    transform:translateX(-50%); pointer-events:none;
    background:conic-gradient(from 180deg at 50% 0%,
      transparent 162deg,
      rgba(90,220,210,.04) 168deg, rgba(150,240,230,.10) 172deg,
      rgba(90,220,210,.03) 176deg, rgba(232,201,138,.08) 180deg,
      rgba(90,220,210,.04) 184deg, rgba(150,240,230,.09) 188deg,
      transparent 198deg);
    -webkit-mask-image:linear-gradient(to bottom,#000 15%,transparent 70%);
            mask-image:linear-gradient(to bottom,#000 15%,transparent 70%);
    filter:blur(8px); animation:rays 9s ease-in-out infinite alternate;
  }
  @keyframes rays { 0% { opacity:.55; transform:translateX(-50%) rotate(-1.5deg); } 100% { opacity:1; transform:translateX(-50%) rotate(1.5deg); } }

  main { position:relative; z-index:1; text-align:center; padding:2.2rem 1.5rem; margin:auto 0; }

  /* ---------- emblem ---------- */
  .stage { perspective:1100px; width:min(36vw,176px); margin:0 auto; }
  .tilt  { transform-style:preserve-3d; transition:transform .7s cubic-bezier(.2,.7,.2,1); }
  .mark  { position:relative; transform-style:preserve-3d; opacity:0;
           animation:enter 2.4s cubic-bezier(.2,.7,.2,1) .2s forwards, sway 14s ease-in-out 2.6s infinite; }
  @keyframes enter { from { opacity:0; transform:translateY(20px) rotateX(20deg) scale(.93); filter:blur(8px); } to { opacity:1; transform:none; filter:blur(0); } }
  @keyframes sway { 0%,100% { transform:rotateY(-15deg) rotateX(4deg) translateY(0); } 50% { transform:rotateY(15deg) rotateX(-3deg) translateY(-8px); } }
  .emblem { width:100%; height:auto; display:block; overflow:visible; animation:glow 7s ease-in-out 2.6s infinite; }
  @keyframes glow {
    0%,100% { filter:drop-shadow(0 20px 28px rgba(0,0,0,.7)) drop-shadow(0 0 12px rgba(232,201,138,.16)); }
    50%     { filter:drop-shadow(0 20px 28px rgba(0,0,0,.7)) drop-shadow(0 0 24px rgba(110,230,220,.22)) drop-shadow(0 0 46px rgba(232,201,138,.12)); }
  }
  .shine, .edge { position:absolute; inset:0; pointer-events:none; clip-path:ellipse(45.8% 47.1% at 50% 50.1%); }
  .shine { background:linear-gradient(112deg, transparent 40%, rgba(255,255,255,.10) 45%, rgba(255,250,235,.55) 50%, rgba(255,255,255,.10) 55%, transparent 60%);
           background-size:300% 100%; mix-blend-mode:screen; animation:sweep 7s cubic-bezier(.45,0,.2,1) 2.4s infinite; }
  @keyframes sweep { 0% { background-position:120% 0; } 45%,100% { background-position:-20% 0; } }
  .edge { background:linear-gradient(200deg,rgba(255,255,255,.22),transparent 45%); mix-blend-mode:screen; animation:edge 14s ease-in-out 2.6s infinite; }
  @keyframes edge { 0%,100% { opacity:.12; } 50% { opacity:.45; } }

  /* ---------- wordmark ---------- */
  .word { margin:1.7rem auto 0; opacity:0; animation:rise 1.8s ease 1.4s forwards;
          font-family:"Montserrat",system-ui,sans-serif; user-select:none; }
  .ne {
    font-weight:300; font-size:clamp(2.1rem,6.2vw,3.3rem); line-height:1; letter-spacing:.16em;
    padding-left:.16em; white-space:nowrap;
  }
  .ne .g {
    background-image:
      linear-gradient(105deg, transparent 42%, rgba(255,250,235,.95) 50%, transparent 58%),
      linear-gradient(180deg, #f7e2b4 0%, #e3b974 48%, #c99550 100%);
    background-size:300% 100%, 100% 100%; background-repeat:no-repeat;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:glint 9s cubic-bezier(.45,0,.2,1) 4s infinite;
  }
  .ne .lam { display:inline-block; transform:rotate(180deg); letter-spacing:0; margin-right:-.16em; animation:none;
    background-image:linear-gradient(0deg, #f7e2b4 0%, #e3b974 48%, #c99550 100%); background-size:100% 100%; }
  @keyframes glint { 0% { background-position:120% 0, 0 0; } 45%,100% { background-position:-20% 0, 0 0; } }
  .the { font-weight:400; font-size:clamp(.6rem,1.5vw,.8rem); letter-spacing:.62em; padding-left:.62em;
          color:#d2f1ee; margin-bottom:.7em; }
  .mv { display:flex; align-items:center; justify-content:center; gap:1.1em; margin-top:.55em;
        font-weight:400; font-size:clamp(.66rem,1.75vw,.95rem); letter-spacing:.62em; color:#d2f1ee; }
  .mv span { padding-left:.62em; }
  .mv i { display:block; width:2.6em; height:1px; background:linear-gradient(90deg,transparent,#d9b273); }
  .mv i:last-child { transform:scaleX(-1); }

  /* ---------- initiatives ---------- */
  .initiatives { --icon:clamp(54px,7vw,66px); --gap:1.6rem; position:relative; width:min(80vw,270px); margin-left:auto; margin-right:auto;
                 display:flex; flex-direction:column; align-items:flex-start; gap:var(--gap);
                 margin-top:2.3rem; opacity:0; animation:rise 1.6s ease 2.0s forwards; }
  .initiative { display:flex; align-items:center; gap:.85rem; width:100%;
                text-decoration:none; color:var(--ink); transition:transform .4s ease, filter .4s ease; }
  a.initiative:hover { transform:translateY(-2px); filter:brightness(1.15); }
  .initiative .icon { width:var(--icon); height:var(--icon); flex:none; display:block; overflow:visible; }
  .initiative img.icon { object-fit:contain; transform:scale(1.08); }
  .initiative .name { font-family:"Montserrat",system-ui,sans-serif; font-weight:300; font-size:clamp(1.2rem,2.8vw,1.55rem);
                      letter-spacing:.01em; line-height:1; white-space:nowrap; color:var(--ink); }
  .initiative .name b { font-weight:600; }

  /* a thread of light rising from Conscious Pulse into Pasai */
  .thread { position:absolute; left:calc(var(--icon) / 2 - .5px); top:calc(var(--icon) + 3px); width:1px;
            height:calc(var(--gap) - 6px); overflow:hidden;
            background:linear-gradient(to top, rgba(140,230,255,.55), rgba(214,248,255,.25)); }
  .thread::after { content:""; position:absolute; left:-1px; width:3px; height:45%; border-radius:2px;
            background:linear-gradient(to top, transparent, #ffffff, transparent); filter:blur(.4px);
            animation:ascend 2.4s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes ascend { 0% { top:110%; opacity:0; } 20% { opacity:1; } 80% { opacity:1; } 100% { top:-50%; opacity:0; } }

  blockquote { margin-top:2.4rem; opacity:0; animation:rise 1.6s ease 2.4s forwards; }
  blockquote p { font-family:"Cormorant Garamond",Georgia,serif; font-style:italic; font-weight:300; font-size:clamp(1.4rem,4vw,2.2rem); line-height:1.25; }
  blockquote footer { margin-top:.9rem; font-size:.72rem; letter-spacing:.32em; text-transform:uppercase; color:var(--muted); }
  @keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }

  @media (max-height:780px) { .stage { width:min(30vw,136px); } .initiatives { margin-top:1.6rem; --gap:1.3rem; } blockquote { margin-top:1.6rem; } }
  @media (max-height:620px) {
    main { padding:1.2rem 1.5rem; } .stage { width:min(26vw,100px); }
    .word { margin-top:1rem; } .ne { font-size:clamp(1.6rem,4.6vw,2.4rem); }
    .initiatives { margin-top:1.1rem; --gap:1rem; --icon:46px; }
    blockquote { margin-top:1.1rem; } blockquote p { font-size:clamp(1.2rem,3vw,1.7rem); }
  }
  @media (prefers-reduced-motion:reduce) {
    .rays,.mark,.emblem,.shine,.edge,.word,.ne .g,.initiatives,.thread::after,blockquote { animation:none !important; opacity:1; transform:none; }
  }
</style>
</head>
<body>
  <canvas id="space" aria-hidden="true"></canvas>
  <div class="rays" aria-hidden="true"></div>
  <main>
    <h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">The New Era Movement</h1>

    <div class="stage">
      <div class="tilt" id="tilt">
        <div class="mark">
          <svg class="emblem" viewBox="0 0 600 904" role="img" aria-label="The New Era Movement emblem">
            <defs>
              <clipPath id="nOval"><ellipse cx="300" cy="453" rx="273" ry="424"/></clipPath>
              <filter id="nGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
              <filter id="nPulse" x="-200%" y="-100%" width="500%" height="300%"><feGaussianBlur stdDeviation="9"/></filter>
              <linearGradient id="nFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".75" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity=".05"/></linearGradient>
              <mask id="nBeamMask"><rect width="600" height="545" fill="url(#nFade)"/></mask>
            </defs>
            <image href="emblem.webp" width="600" height="904" preserveAspectRatio="none"/>
            <g clip-path="url(#nOval)" style="mix-blend-mode:screen">
              <!-- light travelling up the beam -->
              <g mask="url(#nBeamMask)">
                <ellipse cx="300" cy="560" rx="15" ry="58" fill="#e9fffb" opacity=".42" filter="url(#nPulse)"><animate attributeName="cy" values="560;-80" dur="4.2s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .6 1"/></ellipse>
                <ellipse cx="300" cy="560" rx="11" ry="42" fill="#e9fffb" opacity=".28" filter="url(#nPulse)"><animate attributeName="cy" values="560;-80" dur="4.2s" begin="2.1s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .6 1"/></ellipse>
              </g>
              <!-- motes rising out of the gateway -->
              <g id="nMotes" filter="url(#nGlow)"></g>
              <!-- sparks running out along the horizon -->
              <path d="M300 534 Q165 534 0 576" stroke="#fff8e6" stroke-width="2.2" fill="none" stroke-linecap="round" filter="url(#nGlow)" pathLength="100" stroke-dasharray="7 200">
                <animate attributeName="stroke-dashoffset" values="7;-100" dur="3.6s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.75;1" dur="3.6s" repeatCount="indefinite"/>
              </path>
              <path d="M300 534 Q435 534 600 576" stroke="#fff8e6" stroke-width="2.2" fill="none" stroke-linecap="round" filter="url(#nGlow)" pathLength="100" stroke-dasharray="7 200">
                <animate attributeName="stroke-dashoffset" values="7;-100" dur="3.6s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.75;1" dur="3.6s" repeatCount="indefinite"/>
              </path>
              <!-- light tracing the gateway -->
              <path d="M264 534 V390 A36 36 0 0 1 336 390 V534" stroke="#ffffff" stroke-width="2.6" fill="none" stroke-linecap="round" filter="url(#nGlow)" pathLength="100" stroke-dasharray="12 88" opacity=".9">
                <animate attributeName="stroke-dashoffset" values="0;-100" dur="6s" repeatCount="indefinite"/>
              </path>
              <ellipse cx="300" cy="530" rx="55" ry="12" fill="#fff6dc" filter="url(#nPulse)"><animate attributeName="opacity" values=".25;.7;.25" dur="4.2s" repeatCount="indefinite"/></ellipse>
            </g>
            <!-- glint travelling around the gold ring -->
            <ellipse cx="300" cy="453" rx="276" ry="427" fill="none" stroke="#fff4d6" stroke-width="3.2" stroke-linecap="round" filter="url(#nGlow)" pathLength="1000" stroke-dasharray="40 960" opacity=".85" style="mix-blend-mode:screen">
              <animate attributeName="stroke-dashoffset" values="0;-1000" dur="10s" repeatCount="indefinite"/>
            </ellipse>
          </svg>
          <div class="edge" aria-hidden="true"></div>
          <div class="shine" aria-hidden="true"></div>
        </div>
      </div>
    </div>

    <div class="word" role="img" aria-label="The New Era Movement">
      <div class="the" aria-hidden="true">THE</div>
      <div class="ne" aria-hidden="true"><span class="g">NEW ER</span><span class="g lam">V</span></div>
      <div class="mv" aria-hidden="true"><i></i><span>MOVEMENT</span><i></i></div>
    </div>

    <section class="initiatives" aria-label="The New Era Movement initiatives">
      <span class="thread" aria-hidden="true"></span>
      <a class="initiative" href="https://pasai.art" aria-label="Pasai">
        <svg class="icon" viewBox="0 0 100 100" aria-hidden="true">
          <defs>
            <radialGradient id="pIn" cx="50" cy="30" r="56" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0d3f6e" stop-opacity=".55"/><stop offset="1" stop-color="#000516" stop-opacity="0"/></radialGradient>
            <filter id="pGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1.1" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            <clipPath id="pClip"><circle cx="50" cy="50" r="41.5"/></clipPath>
          </defs>
          <circle cx="50" cy="50" r="41.5" fill="url(#pIn)"/>
          <g clip-path="url(#pClip)">
            <path d="M6 72 Q50 58 94 72 L94 100 L6 100 Z" fill="#06123a" opacity=".85"/>
            <path d="M6 72 Q50 58 94 72" stroke="#bff6ff" stroke-width="1.1" fill="none"/>
          </g>
          <path id="pPath" d="M50 65 L39.5 52 L57 41 L45 29.5 L50 18.5" stroke="#7fe7ff" stroke-width=".8" fill="none" opacity=".75"/>
          <g fill="#bff6ff">
            <circle cx="50" cy="65" r="2.1" fill="#ffffff"/>
            <circle cx="39.5" cy="52" r="1.35"/><circle cx="57" cy="41" r="1.35"/><circle cx="45" cy="29.5" r="1.35"/>
          </g>
          <path d="M50 11.5 L51.4 16.9 L56.8 18.3 L51.4 19.7 L50 25.1 L48.6 19.7 L43.2 18.3 L48.6 16.9 Z" fill="#ffffff" filter="url(#pGlow)">
            <animateTransform attributeName="transform" type="scale" values="1;1.18;1" additive="sum" dur="3.2s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1"/>
            <animateTransform attributeName="transform" type="translate" values="0 0;-9 -3.3;0 0" additive="sum" dur="3.2s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1"/>
          </path>
          <circle r="1.7" fill="#ffffff" filter="url(#pGlow)">
            <animateMotion dur="3.2s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.6;1" calcMode="linear"><mpath href="#pPath"/></animateMotion>
            <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.08;.55;.62;1" dur="3.2s" repeatCount="indefinite"/>
          </circle>
          <circle cx="50" cy="50" r="41.5" fill="none" stroke="#1d63ff" stroke-width="1" opacity=".8"/>
          <circle cx="50" cy="50" r="44" fill="none" stroke="#d6f8ff" stroke-width="1.6" filter="url(#pGlow)"/>
          <circle cx="50" cy="50" r="44" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" pathLength="100" stroke-dasharray="6 94" filter="url(#pGlow)">
            <animate attributeName="stroke-dashoffset" values="0;-100" dur="7s" repeatCount="indefinite"/>
          </circle>
        </svg>
        <span class="name"><b>Pasai</b></span>
      </a>
      <div class="initiative" role="img" aria-label="Conscious Pulse">
        <img class="icon" src="cp-icon.webp" alt="" width="360" height="365">
        <span class="name">Conscious <b>Pulse</b></span>
      </div>
    </section>

    <blockquote>
      <p>“Preparing for The New Era.”</p>
      <footer>— The Founder</footer>
    </blockquote>
  </main>

<script>
(function () {
  var still = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- deep space: layered stars, nebula glow, shooting stars ---------- */
  var cv = document.getElementById('space'), c = cv.getContext('2d');
  var W, H, D, stars = [], neb, shoot = null, nextShoot = 4, px = 0, py = 0, tx = 0, ty = 0;
  function r(a, b) { return a + Math.random() * (b - a); }
  function build() {
    D = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * D; cv.height = H * D; c.setTransform(D, 0, 0, D, 0, 0);
    var n = Math.round(W * H / 2600); stars = [];
    for (var i = 0; i < n; i++) {
      var z = Math.random();                         // depth: 0 far, 1 near
      var hue = Math.random();
      stars.push({ x: r(0, W), y: r(0, H), z: z,
        s: z < .85 ? r(.25, .8) : r(.8, 1.5),
        a: z < .85 ? r(.25, .7) : r(.6, 1),
        tw: r(.4, 2.2), ph: r(0, 6.3),
        col: hue < .78 ? '235,242,255' : hue < .9 ? '170,235,255' : '255,226,170' });
    }
    // a faint band of very fine stars across the sky
    for (var j = 0; j < n * .9; j++) {
      var u = Math.random(), off = (Math.random() + Math.random() + Math.random() - 1.5) * H * .16;
      var bx = u * W, by = H * .85 - u * H * .7 + off;
      stars.push({ x: bx, y: by, z: .05, s: r(.2, .55), a: r(.12, .4), tw: r(.3, 1.5), ph: r(0, 6.3), col: '220,232,255' });
    }
    // nebula painted once
    neb = document.createElement('canvas'); neb.width = W * D; neb.height = H * D;
    var g = neb.getContext('2d'); g.setTransform(D, 0, 0, D, 0, 0);
    [[.18, .22, .55, '16,150,160', .10], [.85, .35, .5, '40,60,170', .12], [.62, .9, .6, '25,80,150', .09],
     [.5, .08, .35, '120,220,210', .05], [.3, .75, .4, '200,160,90', .035], [.78, .78, .45, '90,40,150', .05]]
      .forEach(function (b) {
        var rad = Math.max(W, H) * b[2], gr = g.createRadialGradient(b[0] * W, b[1] * H, 0, b[0] * W, b[1] * H, rad);
        gr.addColorStop(0, 'rgba(' + b[3] + ',' + b[4] + ')'); gr.addColorStop(1, 'rgba(' + b[3] + ',0)');
        g.fillStyle = gr; g.fillRect(0, 0, W, H);
      });
  }
  build(); addEventListener('resize', build);
  addEventListener('pointermove', function (e) { tx = (e.clientX / W - .5); ty = (e.clientY / H - .5); });

  var t0 = performance.now(), last = t0;
  function frame(now) {
    var t = (now - t0) / 1000, dt = Math.min(.05, (now - last) / 1000); last = now;
    px += (tx - px) * .04; py += (ty - py) * .04;
    c.clearRect(0, 0, W, H);
    c.drawImage(neb, 0, 0, W, H);
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      if (!still) { s.y -= (2 + s.z * 6) * dt; if (s.y < -2) { s.y = H + 2; s.x = r(0, W); } }
      var x = s.x - px * s.z * 22, y = s.y - py * s.z * 16;
      var a = s.a * (.55 + .45 * Math.sin(t * s.tw + s.ph));
      c.fillStyle = 'rgba(' + s.col + ',' + a.toFixed(3) + ')';
      if (s.s > 1.1) {                                   // bright stars get a soft halo
        var hg = c.createRadialGradient(x, y, 0, x, y, s.s * 4);
        hg.addColorStop(0, 'rgba(' + s.col + ',' + (a * .5).toFixed(3) + ')'); hg.addColorStop(1, 'rgba(' + s.col + ',0)');
        c.fillStyle = hg; c.fillRect(x - s.s * 4, y - s.s * 4, s.s * 8, s.s * 8);
        c.fillStyle = 'rgba(' + s.col + ',' + a.toFixed(3) + ')';
      }
      c.beginPath(); c.arc(x, y, s.s, 0, 6.283); c.fill();
    }
    // shooting star
    if (!still) {
      nextShoot -= dt;
      if (!shoot && nextShoot <= 0) {
        var ang = r(.35, .6);
        shoot = { x: r(W * .15, W * .9), y: r(0, H * .35), vx: -Math.cos(ang) * r(700, 950), vy: Math.sin(ang) * r(700, 950), life: 0, max: r(.7, 1.1) };
        nextShoot = r(7, 14);
      }
      if (shoot) {
        shoot.life += dt; shoot.x += shoot.vx * dt; shoot.y += shoot.vy * dt;
        var p = shoot.life / shoot.max, al = Math.sin(Math.min(1, p) * Math.PI);
        var tl = .16, ex = shoot.x - shoot.vx * tl, ey = shoot.y - shoot.vy * tl;
        var sg = c.createLinearGradient(shoot.x, shoot.y, ex, ey);
        sg.addColorStop(0, 'rgba(255,255,255,' + (.9 * al) + ')'); sg.addColorStop(.3, 'rgba(190,240,255,' + (.35 * al) + ')'); sg.addColorStop(1, 'rgba(190,240,255,0)');
        c.strokeStyle = sg; c.lineWidth = 1.3; c.lineCap = 'round';
        c.beginPath(); c.moveTo(shoot.x, shoot.y); c.lineTo(ex, ey); c.stroke();
        if (p >= 1) shoot = null;
      }
    }
    if (!still) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------- fine motes rising from the gateway ---------- */
  var g = document.getElementById('nMotes');
  if (g) {
    var NS = 'http://www.w3.org/2000/svg', M = [];
    function spawn(m, init) {
      m.y = init ? r(60, 520) : r(480, 528); m.x0 = r(-1, 1) * r(3, 22);
      m.v = r(.2, .55); m.ph = r(0, 6.3); m.tw = r(1, 3);
      m.el.setAttribute('r', r(.7, 1.7).toFixed(2));
      m.el.setAttribute('fill', Math.random() < .75 ? '#ffe2a0' : '#e4fffa');
    }
    for (var i = 0; i < 46; i++) { var el = document.createElementNS(NS, 'circle'); g.appendChild(el); var m = { el: el }; spawn(m, true); M.push(m); }
    var m0 = performance.now();
    (function tick(now) {
      var t = (now - m0) / 1000;
      for (var i = 0; i < M.length; i++) {
        var m = M[i];
        if (!still) { m.y -= m.v; if (m.y < 30) spawn(m, false); }
        var h = 534 - m.y, x = 300 + m.x0 * (1 + h / 110) + Math.sin(t * .6 + m.ph) * 2.5;
        var o = Math.min(1, h / 40) * Math.min(1, m.y / 130) * (.5 + .5 * Math.sin(t * m.tw + m.ph));
        m.el.setAttribute('cx', x.toFixed(1)); m.el.setAttribute('cy', m.y.toFixed(1)); m.el.setAttribute('opacity', o.toFixed(2));
      }
      if (!still) requestAnimationFrame(tick);
    })(m0);
  }

  /* ---------- gentle tilt toward the pointer ---------- */
  var tl = document.getElementById('tilt');
  if (tl && !still && matchMedia('(pointer:fine)').matches) {
    addEventListener('pointermove', function (e) {
      var x = e.clientX / innerWidth - .5, y = e.clientY / innerHeight - .5;
      tl.style.transform = 'rotateY(' + (x * 14) + 'deg) rotateX(' + (-y * 10) + 'deg)';
    });
    document.addEventListener('pointerleave', function () { tl.style.transform = ''; });
  }
})();
</script>
</body>
</html>
